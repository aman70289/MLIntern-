<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Intelligence Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }

        .navbar-brand {
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            padding: 24px;
            margin-bottom: 24px;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 10px 14px;
        }

        .form-control:focus, .form-select:focus {
            background-color: #0f172a;
            color: #fff;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        .btn-gradient {
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 8px;
            padding: 12px 24px;
            transition: all 0.3s ease;
        }

        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(124, 58, 237, 0.4);
            color: #fff;
        }

        .btn-preset {
            background-color: #334155;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.8rem;
            padding: 6px 12px;
            margin-right: 6px;
            margin-bottom: 8px;
        }

        .btn-preset:hover {
            background-color: var(--accent-blue);
            color: #000;
        }

        .probability-meter {
            height: 14px;
            background-color: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin: 16px 0;
        }

        .probability-bar {
            height: 100%;
            width: 0%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .risk-badge {
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .risk-low { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid #22c55e; }
        .risk-medium { background: rgba(234, 179, 8, 0.2); color: #fde047; border: 1px solid #eab308; }
        .risk-high { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid #ef4444; }

        .stat-box {
            background: #0f172a;
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-blue);
        }

        .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark border-bottom border-secondary mb-4 px-4">
        <div class="container-fluid">
            <span class="navbar-brand">
                <i class="fa-solid fa-chart-line me-2"></i> ChurnSense AI
            </span>
            <div>
                <a href="/docs" target="_blank" class="btn btn-outline-info btn-sm me-2">
                    <i class="fa-solid fa-book me-1"></i> Swagger API Docs
                </a>
                <span class="badge bg-success px-3 py-2">
                    <i class="fa-solid fa-circle-check me-1"></i> API Active
                </span>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4">
            
            <!-- Left Column: Input Form -->
            <div class="col-lg-7">
                <div class="glass-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0 text-white"><i class="fa-solid fa-user-gear me-2"></i> Customer Profile Inputs</h5>
                        <div>
                            <span class="text-muted small me-2">Presets:</span>
                            <button class="btn btn-preset" onclick="loadPreset('loyal')">Loyal Customer</button>
                            <button class="btn btn-preset" onclick="loadPreset('atrisk')">High Risk</button>
                        </div>
                    </div>

                    <form id="predictionForm" onsubmit="event.preventDefault(); runPrediction();">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Credit Score (300 - 850)</label>
                                <input type="number" id="CreditScore" class="form-control" value="650" min="300" max="850" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Geography</label>
                                <select id="Geography" class="form-select" required>
                                    <option value="France">France</option>
                                    <option value="Germany">Germany</option>
                                    <option value="Spain">Spain</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Gender</label>
                                <select id="Gender" class="form-select" required>
                                    <option value="Female">Female</option>
                                    <option value="Male">Male</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Age (years)</label>
                                <input type="number" id="Age" class="form-control" value="42" min="18" max="100" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tenure (years)</label>
                                <input type="number" id="Tenure" class="form-control" value="4" min="0" max="15" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Account Balance ($)</label>
                                <input type="number" id="Balance" class="form-control" value="75000" step="100" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Number of Products</label>
                                <select id="NumOfProducts" class="form-select" required>
                                    <option value="1">1 Product</option>
                                    <option value="2" selected>2 Products</option>
                                    <option value="3">3 Products</option>
                                    <option value="4">4 Products</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Estimated Salary ($)</label>
                                <input type="number" id="EstimatedSalary" class="form-control" value="65000" step="500" min="0" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Has Credit Card</label>
                                <select id="HasCrCard" class="form-select" required>
                                    <option value="1" selected>Yes</option>
                                    <option value="0">No</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Is Active Member</label>
                                <select id="IsActiveMember" class="form-select" required>
                                    <option value="1" selected>Yes</option>
                                    <option value="0">No</option>
                                </select>
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <button type="submit" class="btn btn-gradient w-100 py-3">
                                <i class="fa-solid fa-bolt me-2"></i> Predict Customer Churn Risk
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Right Column: Results & Model Performance -->
            <div class="col-lg-5">
                <div class="glass-card">
                    <h5 class="mb-3 text-white"><i class="fa-solid fa-square-poll-vertical me-2"></i> Prediction Output</h5>
                    
                    <div id="resultPlaceholder" class="text-center py-4 text-muted">
                        <i class="fa-solid fa-microchip fa-3x mb-3 text-secondary"></i>
                        <p>Fill out the profile and click <strong>Predict</strong> to evaluate churn probability.</p>
                    </div>

                    <div id="resultCard" style="display: none;">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="text-muted">Churn Probability</span>
                            <span id="riskBadge" class="risk-badge risk-low">Low Risk</span>
                        </div>

                        <div class="display-5 font-monospace fw-bold my-2" id="probText">0.0%</div>

                        <div class="probability-meter">
                            <div id="probBar" class="probability-bar bg-success"></div>
                        </div>

                        <div class="alert alert-dark border-secondary mt-3 mb-0" id="recommendationText">
                            <!-- Dynamic text -->
                        </div>
                    </div>
                </div>

                <!-- Model Stats Card -->
                <div class="glass-card">
                    <h6 class="text-white mb-3"><i class="fa-solid fa-server me-2"></i> Model Metadata & Metrics</h6>
                    <div id="modelMetadataContent" class="row g-2">
                        <div class="col-6">
                            <div class="stat-box">
                                <div class="stat-value" id="metaModelName">--</div>
                                <div class="stat-label">Model Architecture</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="stat-box">
                                <div class="stat-value" id="metaAuc">--</div>
                                <div class="stat-label">ROC-AUC Score</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="stat-box">
                                <div class="stat-value" id="metaAcc">--</div>
                                <div class="stat-label">Accuracy</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="stat-box">
                                <div class="stat-value" id="metaF1">--</div>
                                <div class="stat-label">F1-Score</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", fetchMetadata);

        async function fetchMetadata() {
            try {
                const res = await fetch("/api/v1/metadata");
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById("metaModelName").innerText = data.best_model_name;
                    document.getElementById("metaAuc").innerText = data.metrics['ROC-AUC'];
                    document.getElementById("metaAcc").innerText = (data.metrics['Accuracy'] * 100).toFixed(1) + '%';
                    document.getElementById("metaF1").innerText = data.metrics['F1-Score'];
                }
            } catch (err) {
                console.error("Could not fetch metadata:", err);
            }
        }

        function loadPreset(type) {
            if (type === 'loyal') {
                document.getElementById('CreditScore').value = 760;
                document.getElementById('Geography').value = 'France';
                document.getElementById('Gender').value = 'Male';
                document.getElementById('Age').value = 32;
                document.getElementById('Tenure').value = 7;
                document.getElementById('Balance').value = 85000;
                document.getElementById('NumOfProducts').value = 2;
                document.getElementById('EstimatedSalary').value = 95000;
                document.getElementById('HasCrCard').value = 1;
                document.getElementById('IsActiveMember').value = 1;
            } else if (type === 'atrisk') {
                document.getElementById('CreditScore').value = 480;
                document.getElementById('Geography').value = 'Germany';
                document.getElementById('Gender').value = 'Female';
                document.getElementById('Age').value = 58;
                document.getElementById('Tenure').value = 1;
                document.getElementById('Balance').value = 145000;
                document.getElementById('NumOfProducts').value = 3;
                document.getElementById('EstimatedSalary').value = 42000;
                document.getElementById('HasCrCard').value = 0;
                document.getElementById('IsActiveMember').value = 0;
            }
            runPrediction();
        }

        async function runPrediction() {
            const payload = {
                CreditScore: parseInt(document.getElementById('CreditScore').value),
                Geography: document.getElementById('Geography').value,
                Gender: document.getElementById('Gender').value,
                Age: parseInt(document.getElementById('Age').value),
                Tenure: parseInt(document.getElementById('Tenure').value),
                Balance: parseFloat(document.getElementById('Balance').value),
                NumOfProducts: parseInt(document.getElementById('NumOfProducts').value),
                HasCrCard: parseInt(document.getElementById('HasCrCard').value),
                IsActiveMember: parseInt(document.getElementById('IsActiveMember').value),
                EstimatedSalary: parseFloat(document.getElementById('EstimatedSalary').value)
            };

            try {
                const res = await fetch("/api/v1/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error("API request failed");
                const data = await res.json();

                document.getElementById("resultPlaceholder").style.display = "none";
                document.getElementById("resultCard").style.display = "block";

                const probPct = data.churn_probability_percent;
                document.getElementById("probText").innerText = probPct + "%";

                const bar = document.getElementById("probBar");
                bar.style.width = probPct + "%";

                const badge = document.getElementById("riskBadge");
                const rec = document.getElementById("recommendationText");

                if (data.risk_level === 'Low') {
                    badge.className = "risk-badge risk-low";
                    badge.innerText = "Low Risk";
                    bar.className = "probability-bar bg-success";
                    rec.innerHTML = "<strong>Action:</strong> Customer exhibits high loyalty signals. Recommend standard engagement.";
                } else if (data.risk_level === 'Medium') {
                    badge.className = "risk-badge risk-medium";
                    badge.innerText = "Medium Risk";
                    bar.className = "probability-bar bg-warning";
                    rec.innerHTML = "<strong>Action:</strong> Moderate churn risk detected. Consider targeting with special rewards or loyalty discounts.";
                } else {
                    badge.className = "risk-badge risk-high";
                    badge.innerText = "High Risk";
                    bar.className = "probability-bar bg-danger";
                    rec.innerHTML = "<strong>Action:</strong> High probability of churn! Assign to customer retention team immediately.";
                }

            } catch (err) {
                alert("Prediction Error: " + err.message);
            }
        }
    </script>
</body>
</html>
